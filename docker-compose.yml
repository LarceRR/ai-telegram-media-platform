# Local development stack. No credentials are hardcoded here: every value comes
# from .env (see .env.example), and compose fails loudly if one is missing.
name: atmp

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: atmp-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: atmp-redis
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: atmp-minio
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:latest
    container_name: atmp-minio-init
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-atmp-local}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\"; do sleep 1; done &&
      mc mb --ignore-existing local/\"$$S3_BUCKET\" &&
      echo 'bucket ready'
      "

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    container_name: atmp-api
    profiles: ['apps']
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-atmp-local}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      NODE_ENV: development
    command: sh -c "pnpm install && pnpm build && pnpm prisma:deploy && pnpm --filter @atmp/api dev"
    ports:
      - '3001:3001'
    volumes:
      - .:/app
      - node-modules:/app/node_modules

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    container_name: atmp-worker
    profiles: ['apps']
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://redis:6379
      NODE_ENV: development
    command: sh -c "pnpm install && pnpm build && pnpm --filter @atmp/worker dev"
    volumes:
      - .:/app
      - node-modules:/app/node_modules

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    container_name: atmp-web
    profiles: ['apps']
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3001/api/v1
    command: sh -c "pnpm install && pnpm --filter @atmp/contracts build && pnpm --filter @atmp/web dev"
    ports:
      - '3000:3000'
    volumes:
      - .:/app
      - node-modules:/app/node_modules

volumes:
  postgres-data:
  redis-data:
  minio-data:
  node-modules:
