# TEMPORARY. Delete before merge.
# Runs the pipeline step by step, never fails, and reports the captured output
# back to the pull request so failures are debuggable without log access.
name: CI diagnostics

on:
  pull_request:

jobs:
  diagnose:
    name: Diagnose
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: atmp
          POSTGRES_PASSWORD: atmp
          POSTGRES_DB: atmp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atmp -d atmp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://atmp:atmp@localhost:5432/atmp_test?schema=public
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.0'

      - name: Run pipeline and capture output
        continue-on-error: true
        run: |
          log() { echo ""; echo "=== $1 ==="; }
          run_step() {
            log "$1"
            shift
            if "$@" >>/tmp/ci.log 2>&1; then
              echo "OK: $*" >>/tmp/ci.log
            else
              echo "FAILED (exit $?): $*" >>/tmp/ci.log
            fi
          }
          exec >>/tmp/ci.log 2>&1
          log "versions"
          node --version
          pnpm --version
          run_step "install" pnpm install --no-frozen-lockfile
          run_step "build" pnpm build
          run_step "prisma deploy" pnpm prisma:deploy
          run_step "integration tests" pnpm test:int

      - name: Report to pull request
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo '### CI diagnostics: integration'
            echo
            echo 'Automated. Grep for `FAILED`.'
            echo
            echo '```text'
            tail -c 55000 /tmp/ci.log || echo 'no log captured'
            echo '```'
          } > /tmp/body.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/body.md
