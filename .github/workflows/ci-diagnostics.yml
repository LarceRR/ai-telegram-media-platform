# TEMPORARY. Delete before merge.
# Runs the pipeline step by step, never fails, and reports the captured output
# back to the pull request so failures are debuggable without log access.
name: CI diagnostics

on:
  pull_request:

jobs:
  diagnose:
    name: Diagnose
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      DATABASE_URL: postgresql://atmp:atmp@localhost:5432/atmp?schema=public
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.0'

      - name: Run pipeline and capture output
        continue-on-error: true
        run: |
          log() { echo ""; echo "=== $1 ==="; }
          run_step() {
            log "$1"
            shift
            if "$@" >>/tmp/ci.log 2>&1; then
              echo "OK: $*" >>/tmp/ci.log
            else
              echo "FAILED (exit $?): $*" >>/tmp/ci.log
            fi
          }
          exec >>/tmp/ci.log 2>&1
          log "versions"
          node --version
          pnpm --version
          run_step "install" pnpm install --no-frozen-lockfile
          run_step "prisma validate" pnpm prisma:validate
          run_step "prisma generate" pnpm prisma:generate
          run_step "build" pnpm build
          run_step "lint" pnpm lint
          run_step "typecheck" pnpm typecheck
          run_step "unit tests" pnpm test

      - name: Report to pull request
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo '### CI diagnostics'
            echo
            echo 'Automated. Grep for `FAILED`.'
            echo
            echo '```text'
            tail -c 55000 /tmp/ci.log || echo 'no log captured'
            echo '```'
          } > /tmp/body.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/body.md
