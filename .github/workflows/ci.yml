name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20.18.0'

jobs:
  quality:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://atmp:atmp@localhost:5432/atmp?schema=public
      REDIS_URL: redis://localhost:6379
      OPENROUTER_BASE_URL: https://openrouter.ai/api/v1
      OPENROUTER_APP_NAME: ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: bash scripts/ci-run.sh install pnpm install --no-frozen-lockfile
      - name: Validate Prisma schema
        run: bash scripts/ci-run.sh prisma-validate pnpm prisma:validate
      - name: Typecheck workspace
        run: bash scripts/ci-run.sh typecheck pnpm typecheck
      - name: Build workspace
        run: bash scripts/ci-run.sh build pnpm build
      - name: Lint
        run: bash scripts/ci-run.sh lint pnpm lint
      - name: Unit tests
        run: bash scripts/ci-run.sh unit-tests pnpm test

  integration:
    name: Integration tests (PostgreSQL + pgvector, Redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: atmp
          POSTGRES_PASSWORD: atmp
          POSTGRES_DB: atmp_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U atmp -d atmp_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://atmp:atmp@localhost:5432/atmp_test?schema=public
      REDIS_URL: redis://localhost:6379
      OPENROUTER_BASE_URL: https://openrouter.ai/api/v1
      OPENROUTER_APP_NAME: ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: ${{ env.NODE_VERSION }} }
      - name: Install dependencies
        run: bash scripts/ci-run.sh install pnpm install --no-frozen-lockfile
      - name: Build workspace
        run: bash scripts/ci-run.sh build pnpm build
      - name: Apply migrations
        run: bash scripts/ci-run.sh prisma-deploy pnpm prisma:deploy
      - name: Integration tests
        run: bash scripts/ci-run.sh integration-tests pnpm test:int

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: ${{ env.NODE_VERSION }} }
      - name: Install dependencies
        run: bash scripts/ci-run.sh install pnpm install --no-frozen-lockfile
      - name: Audit
        continue-on-error: true
        run: pnpm audit --audit-level high
